# Dedicated local QA stack. Never shares application database/storage volumes.
name: internship-e2e
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: internship_sprint4_test
      POSTGRES_USER: ${POSTGRES_USER:?Use the local .env configuration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use the local .env configuration}
    volumes:
      - e2e-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d internship_sprint4_test']
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Use the local .env configuration}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Use the local .env configuration}
    volumes:
      - e2e-minio:/data
  backend:
    build:
      context: ./backend
      target: development
    env_file: .env
    environment:
      QA_DATABASE_NAME: internship_sprint4_test
      QA_FIXTURE_NAME: qa-sprint4
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
    command: sh -c "npx prisma generate && npm run build:test && node scripts/serve-qa.cjs"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 20
    volumes:
      - ./backend:/app
      - e2e-backend-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      INTERNAL_API_URL: http://backend:3001
    volumes:
      - ./frontend:/app
      - e2e-frontend-modules:/app/node_modules
      - e2e-next:/app/.next
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  e2e-postgres:
  e2e-minio:
  e2e-backend-modules:
  e2e-frontend-modules:
  e2e-next:
